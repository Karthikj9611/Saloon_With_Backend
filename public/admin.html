<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>

    <!-- DataTables -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #fefaf6;
            margin: 0;
            padding: 40px 20px;
            color: #1e1a17;
        }

        h2 {
            font-family: 'Playfair Display', serif;
            text-align: center;
            margin-bottom: 30px;
            font-size: 26px;
            font-weight: 600;
        }

        /* Stats */
        .top-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat {
            background: #fff3ea;
            padding: 12px 22px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
        }

        /* Card */
        .card {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
        }

        /* Table */
        table.dataTable {
            border-collapse: collapse !important;
        }

        table.dataTable thead th {
            background: #faf6f2;
            color: #a76d4a;
            font-weight: 600;
            padding: 12px 10px;
            border-bottom: 1px solid #eee;
        }

        table.dataTable tbody td {
            padding: 12px 10px;
            border-bottom: 1px solid #f2f2f2;
            font-size: 14px;
        }

        table.dataTable tbody tr:hover {
            background: #fcf8f4;
        }

        /* Button */
        .btn {
            padding: 5px 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 12px;
        }

        .delete {
            background: #ff4d4d;
            color: white;
        }

        /* Search */
        .dataTables_filter {
            margin-bottom: 15px;
        }

        .dataTables_filter input {
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 6px 10px;
        }

        /* Pagination */
        .dataTables_paginate {
            margin-top: 15px;
        }

    </style>
</head>

<body>

<h2>LUXE LOCKS Admin</h2>

<div class="top-bar">
    <div class="stat">Total: <span id="total">0</span></div>
    <div class="stat">Today: <span id="today">0</span></div>
</div>

<div class="card">
    <table id="bookingTable" class="display">
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Service</th>
                <th>Date</th>
                <th>Time</th>
                <th>Notes</th>
                <th></th>
            </tr>
        </thead>
    </table>
</div>

<script>

let table;

$(document).ready(function () {

    table = $('#bookingTable').DataTable({
        ajax: {
            url: '/api/bookings',
            dataSrc: function(data) {

                document.getElementById("total").innerText = data.length;

                let today = new Date().toISOString().split('T')[0];
                document.getElementById("today").innerText =
                    data.filter(b => b.date === today).length;

                return data;
            }
        },
        columns: [
            { data: 'name' },
            { data: 'email' },
            { data: 'service' },
            { data: 'date' },
            { data: 'time' },
            { data: 'notes' },
            {
                data: null,
                render: d => `
                    <button class="btn delete" onclick="deleteBooking('${d._id}')">
                        Delete
                    </button>
                `
            }
        ],
        pageLength: 10
    });

});


// DELETE
async function deleteBooking(id) {
    if (!confirm("Delete booking?")) return;

    await fetch(`/api/book/${id}`, { method: "DELETE" });
    table.ajax.reload();
}

</script>

</body>
</html>
